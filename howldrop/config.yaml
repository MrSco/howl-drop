name: HowlDrop
version: "0.12.0"
image: "ghcr.io/mrsco/howldrop-{arch}"
slug: howldrop
description: AirDrop from iPhones to Home Assistant OS. Files and text land in the share folder; any Wi-Fi card omdrop-owl supports.
url: https://github.com/MrSco/howl-drop
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
host_network: true
host_pid: true
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_ADMIN
devices:
  - /dev/net/tun
apparmor: false
# The howldrop_received event and notifications (announce.py).
homeassistant_api: true
# The HowlDrop panel in the sidebar: recent drops (panel.py). On the host
# network, so a port no other add-on is likely to take.
ingress: true
ingress_port: 47640
panel_title: HowlDrop
# save_folder defaults to /share/howldrop, which the Samba share add-on shows.
map:
  - share:rw
options:
  pc_name: HowlDrop
  save_folder: /share/howldrop
  senders: []
  notify: []
  fetch_links: true
  fetch_max_mb: 100
  delete_after_days: 30
  forward_to_pc: false
  pc_host: ""
  pc_key: ""
  interface: auto
  allow_untested: false
  channels: ""
  aggregation: auto
  verbose: false
  debug_capture: false
schema:
  pc_name: str
  save_folder: "str?"
  senders:
    - "str?"
  notify:
    - "str?"
  fetch_links: "bool?"
  fetch_max_mb: "int(1,2000)?"
  delete_after_days: "int(0,3650)?"
  forward_to_pc: "bool?"
  pc_host: str
  pc_key: "password?"
  interface: "str?"
  allow_untested: "bool?"
  channels: "str?"
  aggregation: "list(auto|on|off)?"
  verbose: "bool?"
  debug_capture: "bool?"
panel_icon: "mdi:wifi"

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  owlyd's name on the system bus. Only root may own it. Anyone may call it:
  Probe() and the properties are for everyone, and owlyd asks polkit before
  Acquire() lends the radio (io.github.t4t5.Owly.acquire). AcquireDetached()
  is root's only, and the other calls act only on the caller's own lease,
  or for root on a detached one.
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.t4t5.Owly"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.t4t5.Owly" send_interface="io.github.t4t5.Owly.Radio1"/>
    <allow send_destination="io.github.t4t5.Owly" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.t4t5.Owly" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.t4t5.Owly" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>

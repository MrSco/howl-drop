name: OwlDrop
version: "0.4.0"
slug: owldrop
description: AirDrop on an MT7612U USB stick or the NUC's Intel Wireless-AC 8260, forwarded over Ethernet to owldrop.exe
url: https://github.com/MrSco/howl-drop
arch:
  - amd64
init: false
startup: application
boot: manual
host_network: true
host_pid: true
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_ADMIN
devices:
  - /dev/net/tun
apparmor: false
options:
  pc_host: ""
  pc_name: ""
  radio: auto
  channels: ""
  unicast_copies: 3
  heard_window_tu: 16
schema:
  pc_host: str
  pc_name: str
  radio: "list(auto|usb|intel)?"
  channels: "str?"
  unicast_copies: "int(1,5)?"
  heard_window_tu: "int(0,64)?"
panel_icon: "mdi:wifi"

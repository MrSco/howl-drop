name: OwlDrop
version: "0.8.1"
slug: owldrop
description: AirDrop from iPhones to Home Assistant OS, on any Wi-Fi card omdrop-owl supports. Files land in the share folder.
url: https://github.com/MrSco/howl-drop
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
host_network: true
host_pid: true
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_ADMIN
devices:
  - /dev/net/tun
apparmor: false
# save_folder defaults to /share/owldrop, which the Samba share add-on shows.
map:
  - share:rw
options:
  pc_name: ""
  save_folder: /share/owldrop
  senders: []
  fetch_links: true
  fetch_max_mb: 100
  forward_to_pc: true
  pc_host: ""
  interface: auto
  allow_untested: false
  channels: ""
  unicast_copies: 1
  heard_window_tu: 0
  verbose: false
  debug_capture: false
schema:
  pc_name: str
  save_folder: "str?"
  senders:
    - "str?"
  fetch_links: "bool?"
  fetch_max_mb: "int(1,2000)?"
  forward_to_pc: "bool?"
  pc_host: str
  interface: "str?"
  allow_untested: "bool?"
  channels: "str?"
  unicast_copies: "int(1,5)?"
  heard_window_tu: "int(0,64)?"
  verbose: "bool?"
  debug_capture: "bool?"
panel_icon: "mdi:wifi"

[package]
name = "omdrop-owl"
description = "Omdrop's radio backend on Owly's radio: omdrop-core's hooks, and omdrop-awdl's helper for Omdrop without omdrop-core. Shipped in the omdrop-owl package."
# The workspace's, which the probe reports.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "signal", "user"] }
owly-radio = { path = "../owly-radio" }
owlyd = { path = "../owlyd" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
regex-lite = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true

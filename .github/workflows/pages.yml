name: Site

# The GitHub Pages site, https://mrsco.github.io/howl-drop/: site/, with the
# app's icon and screenshots copied beside it (so they're kept in one place:
# art/ and docs/screenshots/). site/img/apple-touch-icon.png is the icon made
# square for iOS, which rounds it itself and shows transparency as black.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - art/howldrop.png
      - docs/screenshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the page and its pictures together
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp art/howldrop.png docs/screenshots/window.png docs/screenshots/card-*.png _site/img/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

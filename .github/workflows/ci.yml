name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: shellcheck
        # --severity=warning skips info-level notes the helper relies on
        # intentionally (word-splitting an argument string and a list).
        run: |
          shellcheck --severity=warning \
            userspace/omdrop-discoverable \
            tools/build-owl.sh tools/stage.sh tools/run-tests.sh tools/stage-addon.sh \
            tools/publish-addon.sh addon/run.sh addon/wsl-run.sh docker/install.sh \
            tests/helpers.bash
      - name: Unit tests
        run: tools/run-tests.sh

  # The PC side (howldrop/): its tests on Linux, and howldrop.exe built the
  # way tools/build-howldrop.ps1 does, with MinGW, kept as a download.
  howldrop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S howldrop -B build/howldrop -DCMAKE_BUILD_TYPE=Release && cmake --build build/howldrop -j4
      - name: Test
        run: |
          build/howldrop/howldrop-open-test
          build/howldrop/howldrop-pairing-test
          build/howldrop/howldrop-wsl-test
          build/howldrop/howldrop-bridge-test
          timeout 300 build/howldrop/howldrop-test
          # The commands run.sh starts are accepted (0.15.0 shipped a relay
          # the argument parser refused): without a key the relay must say so.
          build/howldrop/howldrop-bridge relay --inbox /tmp/relay-check 2>&1 | grep -q "needs HOWLDROP_PC_KEY"

  howldrop-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build
        run: cmake -S howldrop -B build/howldrop -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/howldrop
      - name: Test
        run: build/howldrop/howldrop-open-test.exe && build/howldrop/howldrop-pairing-test.exe && build/howldrop/howldrop-wsl-test.exe
      - uses: actions/upload-artifact@v4
        with:
          name: howldrop-windows
          path: build/howldrop/howldrop.exe

  # The prebuilt image Home Assistant pulls, one per architecture, each built
  # on a native runner. A version is built once: an image already in the
  # registry for this version is left as it is, so bump the version in
  # addon/config.yaml to release a change.
  images:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage the add-on
        run: tools/stage-addon.sh
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push, unless this version exists
        run: |
          version=$(awk -F'"' '/^version:/ {print $2}' addon/config.yaml)
          image=ghcr.io/mrsco/howldrop-${{ matrix.arch }}
          if docker manifest inspect "$image:$version" >/dev/null 2>&1; then
            echo "$image:$version is already published"
            exit 0
          fi
          docker build build/addon/howldrop \
            --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION="$version" \
            -t "$image:$version" -t "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"

  # The add-on repository Home Assistant installs from: the assembled add-on
  # on the ha-addon branch, pointing at the images, once both are pushed.
  publish-addon:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: ha-addon
    steps:
      - uses: actions/checkout@v4
      - name: Stage the add-on
        run: tools/stage-addon.sh
      - name: Commit it to ha-addon
        run: tools/publish-addon.sh --image 'ghcr.io/mrsco/howldrop-{arch}'
